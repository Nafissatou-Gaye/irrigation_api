<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Irrigation - Controle</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #061209; color: #dcfce7;
      min-height: 100vh; padding: 24px 16px;
    }
    h1 { font-size: 20px; font-weight: 700; color: #4ade80; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #6b9e7a; margin-bottom: 28px; }

    .card {
      background: #0a1e0d; border: 1px solid rgba(74,222,128,0.09);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }
    .card-title { font-size: 11px; font-weight: 600; color: #6b9e7a;
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; }

    /* Métriques */
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metric { background: #0d2010; border-radius: 12px; padding: 14px; text-align: center; }
    .metric-val { font-size: 28px; font-weight: 700; }
    .metric-lbl { font-size: 11px; color: #6b9e7a; margin-top: 4px; }
    .c-teal   { color: #4ade80; }
    .c-red    { color: #fb923c; }
    .c-blue   { color: #60a5fa; }
    .c-purple { color: #a78bfa; }

    /* Pompe */
    .pump-status {
      display: flex; align-items: center; gap: 16px;
      padding: 16px; background: #0d2010; border-radius: 12px; margin-bottom: 16px;
    }
    .pump-dot {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
      transition: all 0.3s;
    }
    .pump-dot.on  { background: rgba(74,222,128,0.2); box-shadow: 0 0 20px rgba(74,222,128,0.4); }
    .pump-dot.off { background: rgba(100,116,139,0.15); }
    .pump-info p { font-size: 18px; font-weight: 700; }
    .pump-info p.on  { color: #4ade80; }
    .pump-info p.off { color: #6b9e7a; }
    .pump-info span { font-size: 12px; color: #6b9e7a; }

    /* Boutons */
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .btn {
      padding: 16px; border: none; border-radius: 12px; font-size: 15px;
      font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-on   { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .btn-off  { background: rgba(251,146,60,0.12);  color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }
    .btn-auto { background: rgba(96,165,250,0.12);  color: #60a5fa; border: 1px solid rgba(96,165,250,0.25);
                grid-column: span 2; }

    /* Mode */
    .mode-row { display: flex; align-items: center; justify-content: space-between; }
    .mode-pill { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .mode-pill.auto   { background: rgba(96,165,250,0.12); color: #60a5fa; border: 1px solid rgba(96,165,250,0.25); }
    .mode-pill.manuel { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }

    .update { font-size: 12px; color: #4a6a54; }
    .dot-live { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #4ade80; margin-right: 5px; animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>

<h1>Irrigation Intelligente</h1>
<p class="subtitle"><span class="dot-live"></span>Controle a distance</p>

<!-- Métriques -->
<div class="card">
  <div class="card-title">Capteurs en temps reel</div>
  <div class="metrics">
    <div class="metric">
      <div class="metric-val c-teal" id="v-hum">--</div>
      <div class="metric-lbl">Humidite sol %</div>
    </div>
    <div class="metric">
      <div class="metric-val c-red" id="v-temp">--</div>
      <div class="metric-lbl">Temperature °C</div>
    </div>
    <div class="metric">
      <div class="metric-val c-blue" id="v-water">--</div>
      <div class="metric-lbl">Reservoir %</div>
    </div>
  </div>
</div>

<!-- Pompe -->
<div class="card">
  <div class="card-title">Etat de la pompe</div>
  <div class="pump-status">
    <div class="pump-dot off" id="pump-dot">💧</div>
    <div class="pump-info">
      <p class="off" id="pump-txt">ARRET</p>
      <span id="pump-reason">En attente</span>
    </div>
  </div>

  <!-- Controles -->
  <div class="btns">
    <button class="btn btn-on"  onclick="cmd(true)">Activer pompe</button>
    <button class="btn btn-off" onclick="cmd(false)">Arreter pompe</button>
    <button class="btn btn-auto" onclick="auto()">Mode automatique</button>
  </div>
</div>

<!-- Mode + heure -->
<div class="card">
  <div class="mode-row">
    <span class="mode-pill auto" id="mode-pill">Automatique</span>
    <span class="update" id="last-update">--</span>
  </div>
</div>

<script>
  const API = window.location.origin;

  async function refresh() {
    try {
      const r = await fetch(API + "/status");
      const s = await r.json();
      const m = s.derniere_mesure;
      const d = s.decision_ia;

      if (m) {
        document.getElementById("v-hum").textContent   = m.humidity.toFixed(1);
        document.getElementById("v-temp").textContent  = m.temperature.toFixed(1);
        document.getElementById("v-water").textContent = m.water_level.toFixed(1);
      }

      const on = s.pompe;
      document.getElementById("pump-dot").className = "pump-dot " + (on ? "on" : "off");
      document.getElementById("pump-txt").className = on ? "on" : "off";
      document.getElementById("pump-txt").textContent = on ? "EN MARCHE" : "ARRET";

      const pill = document.getElementById("mode-pill");
      pill.textContent = s.mode === "manuel" ? "Manuel" : "Automatique";
      pill.className = "mode-pill " + (s.mode === "manuel" ? "manuel" : "auto");
      document.getElementById("last-update").textContent = new Date().toLocaleTimeString("fr-FR");
    } catch(e) {
      document.getElementById("last-update").textContent = "Connexion perdue";
    }
  }

  async function cmd(activer) {
    await fetch(API + "/manual", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({activate: activer})
    });
    refresh();
  }

  async function auto() {
    await fetch(API + "/manual", { method: "DELETE" });
    refresh();
  }

  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
